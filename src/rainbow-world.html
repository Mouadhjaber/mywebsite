(()=>{const $=s=>document.querySelector(s),places=[{id:'home',name:'بيت كوكو',icon:'🏡',reward:15,open:0},{id:'forest',name:'الغابة السحرية',icon:'🦊',reward:20,open:0},{id:'hospital',name:'مستشفى الحيوانات',icon:'🏥',reward:25,open:0},{id:'shop',name:'متجر الأزياء',icon:'🛍️',reward:20,open:30},{id:'island',name:'الجزيرة السرية',icon:'🏝️',reward:40,open:55},{id:'palace',name:'قصر قوس قزح',icon:'🏰',reward:50,open:85}];let state;try{state=JSON.parse(localStorage.rainbowWorld)}catch{}state??={coins:0,done:{},shop:[]};const save=()=>localStorage.rainbowWorld=JSON.stringify(state);const add=n=>{state.coins+=n;save();burst();render()};function burst(){for(let i=0;i<18;i++){let s=document.createElement('i');s.className='spark';s.textContent=['✨','🌈','💖','🪙'][i%4];s.style.left=(42+Math.random()*16)+'%';s.style.top='48%';document.body.append(s);setTimeout(()=>s.remove(),950)}}function render(){$('#coins').textContent=state.coins;let done=Object.keys(state.done).length;$('#progress').textContent=done+' / 6';$('#locations').innerHTML=places.map(p=>{let locked=state.coins<p.open&&!state.done[p.id],complete=state.done[p.id];return `<button class="location ${locked?'locked':''} ${complete?'done':''}" data-id="${p.id}"><span class="icon">${p.icon}</span>${p.name}<span class="status">${complete?'✓ تمّت':locked?'🔒 '+p.open+' عملة':'+'+p.reward+' عملة'}</span></button>`}).join('');[...document.querySelectorAll('.location')].forEach(b=>b.onclick=()=>open(b.dataset.id))}function reward(id){if(state.done[id])return;state.done[id]=true;add(places.find(x=>x.id===id).reward);$('#quest').textContent='رائع يا كوكو! أنجزتِ مهمة جديدة.';close()}function close(){$('#overlay').classList.remove('show')}function panel(html){$('#panel').innerHTML=html;$('#overlay').classList.add('show')}function choices(list,need,onDone){let c=[];panel(`<div class="big">${list.icon}</div><h2>${list.title}</h2><p>${list.text}</p><div class="task">${list.items.map((x,i)=>`<button class="choice" data-i="${i}">${x}</button>`).join('')}</div><p id="count">اختاري ${need} أشياء</p><button id="finish" class="play" disabled>أنهي المهمة</button><button class="close">رجوع للخريطة</button>`);[...document.querySelectorAll('.choice')].forEach(x=>x.onclick=()=>{x.classList.add('selected');c.push(x);$('#count').textContent='أحسنت! '+c.length+' / '+need;if(c.length>=need)$('#finish').disabled=false});$('#finish').onclick=onDone;$('.close').onclick=close}function open(id){let p=places.find(x=>x.id===id);if(state.coins<p.open&&!state.done[id]){$('#quest').textContent='يلزمك '+p.open+' عملة لفتح '+p.name;return}if(state.done[id]){panel(`<div class="big">${p.icon}</div><h2>${p.name}</h2><p>أنجزتِ هذه المغامرة! يمكنك استكشاف مكان آخر.</p><button class="play">رجوع</button>`);$('.play').onclick=close;return}if(id==='home')return choices({icon:'🏡',title:'زينة بيت كوكو',text:'اختاري 3 أشياء لتزيين بيت كوكو.',items:['🛏️ سرير وردي','🪴 نبتة سحرية','🖼️ لوحة قوس قزح','🧸 دبدوب لطيف']},3,()=>reward(id));if(id==='forest')return choices({icon:'🌳',title:'مساعدة الحيوانات',text:'تحدثي مع الحيوانات وساعدي ثلاثة منها.',items:['🐰 أرنب يبحث عن جزر','🦉 بومة ضاعت نظارتها','🦊 ثعلب يريد صديقًا','🐿️ سنجاب جائع']},3,()=>reward(id));if(id==='hospital')return choices({icon:'🏥',title:'طبيب الحيوانات',text:'اختاري الأدوات المناسبة لعلاج القطة.',items:['🩺 فحص القلب','🩹 ضمادة ناعمة','💊 دواء لطيف','❤️ حضن شفاء']},3,()=>reward(id));if(id==='shop'){panel(`<div class="big">🛍️</div><h2>متجر الأزياء</h2><p>اشتري قطعتين لكوكو. كل قطعة بـ 10 عملات.</p><div class="shop-grid">${['👗 فستان','👒 قبعة','👟 حذاء','🎀 فيونكة','👜 حقيبة','🕶️ نظارة'].map((x,i)=>`<button class="item ${state.shop.includes(i)?'bought':''}" data-i="${i}"><span class="wear">${x.split(' ')[0]}</span>${x.split(' ')[1]}<br>🪙 10</button>`).join('')}</div><p id="shopmsg">اشتريتِ ${state.shop.length} / 2</p><button class="close">رجوع للخريطة</button>`);[...document.querySelectorAll('.item')].forEach(x=>x.onclick=()=>{let i=+x.dataset.i;if(state.coins<10){$('#shopmsg').textContent </script><script type="module">

const map=document.querySelector('.map'),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(44,1,.1,100),renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.domElement.id='three-world';map.prepend(renderer.domElement);camera.position.set(0,7.5,11);camera.lookAt(0,0,0);scene.add(new THREE.HemisphereLight(0xfff7ff,0x55b27a,3));const sun=new THREE.DirectionalLight(0xffeecc,3);sun.position.set(4,8,5);sun.castShadow=true;scene.add(sun);const world=new THREE.Group();scene.add(world);const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.45,metalness:.08});const floor=new THREE.Mesh(new THREE.CircleGeometry(8,48),mat(0x75d997));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;world.add(floor);function cube(x,z,c,h=1){let m=new THREE.Mesh(new THREE.BoxGeometry(1,h,1),mat(c));m.position.set(x,h/2,z);m.castShadow=true;world.add(m);return m}function tree(x,z){let trunk=cube(x,z,0x9a633d,.65);let leaves=new THREE.Mesh(new THREE.ConeGeometry(.55,1.5,12),mat(0x47c77d));leaves.position.set(x,1.35,z);leaves.castShadow=true;world.add(leaves)}function house(x,z,c){let base=cube(x,z,c,1.05),roof=new THREE.Mesh(new THREE.ConeGeometry(.9,.65,4),mat(0xff9bbf));roof.position.set(x,1.38,z);roof.rotation.y=Math.PI/4;roof.castShadow=true;world.add(roof)}function crystal(x,z,c){let q=new THREE.Mesh(new THREE.OctahedronGeometry(.24),mat(c));q.position.set(x,.35,z);world.add(q);return q}house(-4,-1,0x8e79ff);house(3,-2,0x5acbff);house(-1,3,0xffc75f);[-5,-3,0,2,4].forEach((x,i)=>tree(x, i%2?2:-3));const gems=[crystal(-3,2,0xff75ba),crystal(2,2,0xffd75c),crystal(4,1,0x6eeec1),crystal(-1,-3,0x8d7bff)];const clouds=[];for(let i=0;i<5;i++){let c=new THREE.Mesh(new THREE.SphereGeometry(.38,14,10),mat(0xffffff));c.position.set(-5+i*2,3.5+(i%2)*.3,-3);c.scale.set(1.7,.7,.7);scene.add(c);clouds.push(c)}function resize(){let r=map.getBoundingClientRect();renderer.setSize(r.width,r.height);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}let t=0;function loop(){t+=.012;world.rotation.y=Math.sin(t*.25)*.09;gems.forEach((g,i)=>{g.rotation.y+=.035;g.position.y=.35+Math.sin(t*2+i)*.11});clouds.forEach((c,i)=>c.position.x=-5+i*2+Math.sin(t*.3+i)*.45);renderer.render(scene,camera);requestAnimationFrame(loop)}resize();addEventListener('resize',resize);loop();
