<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0"><meta http-equiv="Pragma" content="no-cache"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Rainbow Drive: لعبة قيادة ثلاثية الأبعاد للأطفال في عالم قوس قزح."><meta property="og:type" content="website"><meta property="og:title" content="Rainbow Drive – قيادة في عالم قوس قزح"><meta property="og:description" content="قد كوكو في عالم ثلاثي الأبعاد واجمع العملات."><meta property="og:url" content="https://mouadhjaber.com/rainbow-world.html"><meta property="og:image" content="https://mouadhjaber.com/assets/profile.jpg"><title>Rainbow Drive – عالم قوس قزح</title><style>
:root{--ink:#fff;--navy:#202051;--pink:#ff76b7;--purple:#9274ff;--mint:#72ecc1;--gold:#ffd75a}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#78d5ff;font-family:Tahoma,Arial,sans-serif;color:var(--ink)}#game{position:fixed;inset:0;touch-action:none}#game canvas{display:block;width:100%;height:100%}.hud{position:fixed;z-index:3;top:max(15px,env(safe-area-inset-top));right:15px;left:15px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}.brand,.stat{padding:10px 14px;border:2px solid rgba(255,255,255,.8);border-radius:16px;background:rgba(32,32,81,.67);box-shadow:0 5px 0 rgba(31,20,74,.25);backdrop-filter:blur(8px)}.brand{font:900 clamp(.95rem,4vw,1.35rem) Tahoma,Arial,sans-serif}.brand small{display:block;margin-top:3px;color:#ffdd60;font:700 .62em Tahoma,Arial,sans-serif}.stat{font:900 1rem Tahoma,Arial,sans-serif;white-space:nowrap}.stat:before{content:'🪙 '}.tip{position:fixed;z-index:3;top:92px;right:50%;transform:translateX(50%);width:max-content;max-width:calc(100% - 30px);padding:8px 13px;border-radius:999px;background:rgba(255,255,255,.88);color:#65487d;text-align:center;font:700 .78rem Tahoma,Arial,sans-serif;box-shadow:0 4px 0 rgba(65,49,121,.16);transition:opacity .4s}.controls{position:fixed;z-index:4;right:0;bottom:max(17px,env(safe-area-inset-bottom));left:0;display:flex;align-items:end;justify-content:space-between;padding:0 20px;pointer-events:none}.pad,.pedals{display:grid;gap:9px;pointer-events:auto}.pad{grid-template-columns:repeat(2,58px)}.pedals{grid-template-columns:repeat(2,58px)}.drive{height:58px;border:2px solid rgba(255,255,255,.82);border-radius:18px;background:rgba(32,32,81,.7);color:#fff;box-shadow:0 5px 0 rgba(31,20,74,.3);font-size:25px;cursor:pointer;touch-action:none}.drive:active,.drive.active{transform:translateY(4px);box-shadow:0 1px 0 rgba(31,20,74,.3);background:#ff76b7}.help{position:fixed;z-index:3;bottom:20px;right:50%;transform:translateX(50%);margin:0;color:#fff;text-align:center;font:700 .7rem Tahoma,Arial,sans-serif;text-shadow:0 2px 3px #33336c;pointer-events:none}.win{position:fixed;z-index:8;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(32,22,83,.55);backdrop-filter:blur(8px)}.win.show{display:flex}.winbox{width:min(100%,390px);padding:30px 22px;border:6px solid #fff;border-radius:30px;background:linear-gradient(145deg,#fff6ff,#e6ffff);color:#65487d;text-align:center;box-shadow:0 20px 50px rgba(25,5,73,.4)}.winbox b{display:block;font-size:72px}.winbox h1{margin:5px 0;color:#8a5e9e;font-size:2rem}.winbox p{line-height:1.8}.again{padding:12px 22px;border:0;border-radius:999px;background:linear-gradient(90deg,#ff76b7,#9274ff);color:#fff;box-shadow:0 6px 0 #6d53ba;cursor:pointer;font:800 .9rem Tahoma,Arial,sans-serif}@media(min-width:700px){.controls{padding:0 45px}.pad,.pedals{grid-template-columns:repeat(2,68px)}.drive{height:68px}.help{font-size:.8rem}}@media(max-width:380px){.pad,.pedals{grid-template-columns:repeat(2,50px)}.drive{height:50px;border-radius:15px}.hud{right:9px;left:9px}.brand,.stat{padding:8px 9px}.tip{top:78px}}
</style></head><body><main id="game" aria-label="لعبة قيادة عالم قوس قزح ثلاثية الأبعاد"></main><div class="hud"><div class="brand">🌈 Rainbow Drive<small>قيادة كوكو السحرية</small></div><div id="coins" class="stat">0 / 12</div></div><div id="tip" class="tip">اجمعي عملات قوس قزح وافتحي البوابة!</div><div class="controls"><div class="pad"><button class="drive" data-key="left" aria-label="يسار">◀</button><button class="drive" data-key="right" aria-label="يمين">▶</button></div><div class="pedals"><button class="drive" data-key="back" aria-label="خلف">▼</button><button class="drive" data-key="forward" aria-label="أمام">▲</button></div></div><p class="help">استخدمي الأسهم أو WASD · أزرار اللمس للهاتف</p><div id="win" class="win"><div class="winbox"><b>🏁🌈</b><h1>أحسنت يا كوكو!</h1><p>وصلتِ إلى بوابة قوس قزح وجمعتِ كل العملات!</p><button id="again" class="again">جولة جديدة</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js';
const host=document.querySelector('#game'),coinsEl=document.querySelector('#coins'),tip=document.querySelector('#tip'),win=document.querySelector('#win');const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(58,1,.1,150),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;host.appendChild(renderer.domElement);scene.background=new THREE.Color(0x72d5ff);scene.fog=new THREE.Fog(0x72d5ff,32,75);const hemi=new THREE.HemisphereLight(0xffffff,0x5ab76d,3);scene.add(hemi);const sun=new THREE.DirectionalLight(0xfff0cc,3);sun.position.set(12,20,10);sun.castShadow=true;scene.add(sun);const mat=(c,r=.55,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});const world=new THREE.Group();scene.add(world);const ground=new THREE.Mesh(new THREE.PlaneGeometry(120,120),mat(0x67cb84));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;world.add(ground);const roadPts=[];for(let i=0;i<160;i++){let z=18-i*.55,x=Math.sin(i*.12)*3.4;roadPts.push(new THREE.Vector3(x,.015,z))}const road=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(roadPts),220,1.35,8,false),mat(0x655c91));world.add(road);/* road strips */for(let i=6;i<roadPts.length;i+=8){let p=roadPts[i],prev=roadPts[i-1],angle=Math.atan2(p.x-prev.x,p.z-prev.z),strip=new THREE.Mesh(new THREE.BoxGeometry(.18,.02,.8),mat(0xfff4bd));strip.position.copy(p);strip.position.y=.05;strip.rotation.y=angle;world.add(strip)}function tree(x,z,s=1){let g=new THREE.Group(),tr=new THREE.Mesh(new THREE.CylinderGeometry(.11*s,.16*s,.75*s,8),mat(0x9b663e)),leaf=new THREE.Mesh(new THREE.ConeGeometry(.55*s,1.4*s,10),mat(0x42bb70));tr.position.y=.37*s;leaf.position.y=1.2*s;g.add(tr,leaf);g.position.set(x,0,z);g.castShadow=true;world.add(g)}for(let i=0;i<70;i++){let z=18-Math.random()*85,x=Math.sin((18-z)/.55*.12)*3.4+(Math.random()>.5?1:-1)*(4+Math.random()*8);tree(x,z,.65+Math.random()*.8)}function house(x,z,c){let b=new THREE.Mesh(new THREE.BoxGeometry(1.7,1.35,1.45),mat(c)),r=new THREE.Mesh(new THREE.ConeGeometry(1.3,.75,4),mat(0xff94bd));b.position.set(x,.68,z);r.position.set(x,1.72,z);r.rotation.y=Math.PI/4;b.castShadow=r.castShadow=true;world.add(b,r)}house(-7,5,0x9079ff);house(7,-17,0x5ccaff);house(-8,-43,0xffca68);const car=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(1.1,.42,1.75),mat(0xff72b5,.3,.1)),hood=new THREE.Mesh(new THREE.BoxGeometry(.95,.28,.7),mat(0xff9cca,.25,.1)),seat=new THREE.Mesh(new THREE.BoxGeometry(.65,.3,.6),mat(0x7c68e9));body.position.y=.45;hood.position.set(0,.65,-.38);seat.position.set(0,.74,.38);car.add(body,hood,seat);for(let x of [-.48,.48])for(let z of [-.55,.55]){let w=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,.16,12),mat(0x25243e));w.rotation.z=Math.PI/2;w.position.set(x,.25,z);car.add(w)}const coco=new THREE.Sprite(new THREE.SpriteMaterial({map:emoji('👧'),transparent:true}));coco.position.set(0,1.45,.25);coco.scale.set(.8,.8,1);car.add(coco);scene.add(car);const unicorn=new THREE.Sprite(new THREE.SpriteMaterial({map:emoji('🦄'),transparent:true}));unicorn.scale.set(1.35,1.35,1);scene.add(unicorn);const bunny=new THREE.Sprite(new THREE.SpriteMaterial({map:emoji('🐰'),transparent:true}));bunny.scale.set(1,1,1);scene.add(bunny);function emoji(e){let c=document.createElement('canvas');c.width=c.height=128;let x=c.getContext('2d');x.font='94px serif';x.textAlign='center';x.textBaseline='middle';x.fillText(e,64,70);return new THREE.CanvasTexture(c)}let carAngle=0,velocity=0,coins=0,won=false;car.position.copy(roadPts[0]);car.position.y=.1;const pickups=[];for(let i=12;i<roadPts.length-12;i+=11){let base=roadPts[i],q=new THREE.Mesh(new THREE.CylinderGeometry(.27,.27,.1,18),mat(0xffd75a,.25,.45));q.position.set(base.x, .55,base.z);q.rotation.x=Math.PI/2;scene.add(q);pickups.push(q)}const gate=new THREE.Group();let a=new THREE.Mesh(new THREE.TorusGeometry(2.1,.2,12,32,Math.PI),mat(0xff78b8,.2,.15));a.rotation.z=Math.PI;gate.add(a);let gPos=roadPts[roadPts.length-7];gate.position.set(gPos.x,.1,gPos.z);gate.visible=false;scene.add(gate);const keys={forward:false,back:false,left:false,right:false};function key(e,on){let k=e.key.toLowerCase();if(k==='arrowup'||k==='w')keys.forward=on;if(k==='arrowdown'||k==='s')keys.back=on;if(k==='arrowleft'||k==='a')keys.left=on;if(k==='arrowright'||k==='d')keys.right=on}addEventListener('keydown',e=>key(e,true));addEventListener('keyup',e=>key(e,false));document.querySelectorAll('.drive').forEach(b=>{let k=b.dataset.key;for(let ev of ['pointerdown','pointerenter'])b.addEventListener(ev,e=>{if(e.buttons||ev==='pointerdown'){keys[k]=true;b.classList.add('active')}});for(let ev of ['pointerup','pointercancel','pointerleave'])b.addEventListener(ev,()=>{keys[k]=false;b.classList.remove('active')})});function updateHud(){coinsEl.textContent=coins+' / 12';if(coins===12){gate.visible=true;tip.textContent='البوابة ظهرت! قدّي نحو قوس قزح!'}}function reset(){coins=0;won=false;velocity=0;car.position.copy(roadPts[0]);car.position.y=.1;carAngle=0;car.rotation.y=0;pickups.forEach(q=>q.visible=true);gate.visible=false;win.classList.remove('show');tip.textContent='اجمعي عملات قوس قزح وافتحي البوابة!';updateHud()}function resize(){let r=host.getBoundingClientRect();renderer.setSize(r.width,r.height);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}function loop(){if(!won){if(keys.forward)velocity=Math.min(velocity+.008,.22);else if(keys.back)velocity=Math.max(velocity-.009,-.10);else velocity*=.96;if(Math.abs(velocity)>.01){if(keys.left)carAngle+=.035*(velocity>=0?1:-1);if(keys.right)carAngle-=.035*(velocity>=0?1:-1)}car.rotation.y=carAngle;car.position.x-=Math.sin(carAngle)*velocity;car.position.z-=Math.cos(carAngle)*velocity;car.position.x=Math.max(-12,Math.min(12,car.position.x));car.position.z=Math.max(-70,Math.min(19,car.position.z));pickups.forEach(q=>{if(q.visible){q.rotation.z+=.06;q.position.y=.55+Math.sin(performance.now()*.005+q.position.z)*.11;if(car.position.distanceTo(q.position)<1.05){q.visible=false;coins++;updateHud();tip.textContent='✨ عملة سحرية! استمري يا كوكو!'}}});if(gate.visible&&car.position.distanceTo(gate.position)<2.2){won=true;velocity=0;setTimeout(()=>win.classList.add('show'),300)}}let target=new THREE.Vector3(car.position.x+Math.sin(carAngle)*5,5.2,car.position.z+Math.cos(carAngle)*8);camera.position.lerp(target,.08);camera.lookAt(car.position.x,0,car.position.z-3);let side=new THREE.Vector3(Math.cos(carAngle),0,-Math.sin(carAngle));let follow=new THREE.Vector3(car.position.x+side.x*1.55,1.05,car.position.z+side.z*1.05);unicorn.position.lerp(follow,.08);unicorn.position.y=1.05+Math.sin(performance.now()*.006)*.13;let bunnyTarget=new THREE.Vector3(car.position.x-side.x*1.35,0.78,car.position.z+side.z*.85);bunny.position.lerp(bunnyTarget,.1);bunny.position.y=.78+Math.abs(Math.sin(performance.now()*.008))*.16;gate.rotation.y+=.015;renderer.render(scene,camera);requestAnimationFrame(loop)}document.querySelector('#again').onclick=reset;resize();addEventListener('resize',resize);updateHud();loop();
</script></body></html>
