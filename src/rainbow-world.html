<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Rainbow World: لعبة عربية خيالية للأطفال، مغامرات كوكو ووحيد القرن السحري."><meta property="og:type" content="website"><meta property="og:title" content="Rainbow World – عالم قوس قزح"><meta property="og:description" content="مغامرات كوكو ووحيد القرن السحري في عالم ملوّن للأطفال."><meta property="og:url" content="https://mouadhjaber.com/rainbow-world.html"><meta property="og:image" content="https://mouadhjaber.com/assets/profile.jpg"><title>Rainbow World – عالم قوس قزح</title>
<style>
:root{--navy:#18204d;--ink:#fff;--pink:#ff76b7;--purple:#8c72ff;--blue:#61c8ff;--mint:#75edc3;--yellow:#ffd85b;--orange:#ff9a67;--shadow:0 10px 0 rgba(44,26,87,.18)}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--navy);font-family:Tahoma,Arial,sans-serif;background:linear-gradient(140deg,#ffe3f3,#e8ddff 42%,#d9f7ff)}.page{width:min(100%,920px);min-height:100vh;margin:auto;padding:26px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{font-size:clamp(1.6rem,5vw,2.6rem);font-weight:900;line-height:.95;text-shadow:2px 3px #fff}.brand small{display:block;margin-top:8px;color:#7c5d98;font-size:.38em;letter-spacing:.08em}.coin{padding:9px 15px;border-radius:999px;background:#fff;color:#8e6511;box-shadow:var(--shadow);font-weight:800}.coin:before{content:'🪙 ';}.game-card{position:relative;overflow:hidden;margin-top:22px;border:7px solid #fff;border-radius:32px;background:#a9edff;box-shadow:0 16px 45px rgba(76,44,137,.25)}.sky{height:155px;background:linear-gradient(#66caff,#c9f8ff);position:relative}.cloud{position:absolute;color:#fff;font-size:55px;filter:drop-shadow(0 4px 0 rgba(73,159,195,.16))}.cloud.a{top:18px;right:8%}.cloud.b{top:70px;left:7%;font-size:36px}.rainbow{position:absolute;right:50%;bottom:-47px;transform:translateX(50%) rotate(-7deg);width:265px;height:135px;border:24px solid #ff7db7;border-bottom:0;border-radius:260px 260px 0 0;box-shadow:0 -18px 0 #ffdc58,0 -36px 0 #71efbf,0 -54px 0 #65bfff,0 -72px 0 #9b7bff}.town{position:relative;min-height:440px;padding:90px 20px 25px;background:linear-gradient(#a9edff 0 7%,#81e2a4 7% 100%)}.path{position:absolute;z-index:0;inset:42px 0 0;background:repeating-linear-gradient(140deg,transparent 0 55px,rgba(255,255,255,.58) 57px 86px,transparent 88px 140px);opacity:.7}.hero{position:absolute;z-index:3;right:50%;top:35px;transform:translateX(50%);text-align:center;filter:drop-shadow(0 7px 0 rgba(44,26,87,.15))}.hero .unicorn{font-size:74px;display:block;transform:scaleX(-1)}.hero .coco{position:absolute;right:-25px;bottom:9px;font-size:41px}.hero b{display:inline-block;padding:5px 9px;border-radius:12px;background:#fff;color:#8a5a9e;font-size:.72rem;white-space:nowrap}.places{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:95px}.place{min-height:120px;padding:11px 6px;border:0;border-radius:22px;background:rgba(255,255,255,.92);color:var(--navy);cursor:pointer;box-shadow:var(--shadow);font:800 .76rem Tahoma,Arial,sans-serif;transition:.2s}.place:hover:not(.locked){transform:translateY(-6px) rotate(-1deg)}.place .icon{display:block;font-size:43px;margin-bottom:4px}.place.locked{filter:saturate(.25);opacity:.68;cursor:not-allowed}.place.locked:after{content:'🔒';display:block;font-size:18px}.bottom{padding:18px;background:#fff}.quest{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border-radius:16px;background:#fff1f8;color:#805475;font-weight:800;font-size:.85rem}.quest span{color:#c75b91}.share{display:block;margin:14px auto 0;width:max-content;padding:8px 14px;border-radius:999px;background:#1877f2;color:#fff;text-decoration:none;font-weight:700;font-size:.78rem}.modal{position:fixed;z-index:10;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(38,25,78,.45);backdrop-filter:blur(5px)}.modal.show{display:flex}.modal-box{width:min(100%,390px);padding:27px 22px;border:6px solid #fff;border-radius:28px;background:linear-gradient(145deg,#fff,#fff6fc);text-align:center;box-shadow:0 20px 50px rgba(30,10,60,.3)}.modal-box .big{font-size:70px}.modal-box h2{margin:9px 0;color:#805475;font-size:1.55rem}.modal-box p{color:#765f83;line-height:1.8}.play{padding:11px 23px;border:0;border-radius:999px;background:linear-gradient(90deg,#ff76b7,#9d79ff);color:#fff;box-shadow:0 6px 0 #8058c1;cursor:pointer;font:800 .9rem Tahoma,Arial,sans-serif}.play:active{transform:translateY(4px);box-shadow:0 2px 0 #8058c1}.spark{position:absolute;pointer-events:none;font-size:22px;animation:float .8s forwards}@keyframes float{to{transform:translateY(-65px) rotate(80deg);opacity:0}}footer{padding:20px;text-align:center;color:#765f83;font-size:.75rem}@media(max-width:520px){.page{padding:14px}.game-card{border-radius:25px}.places{gap:9px}.place{min-height:102px;border-radius:17px;font-size:.65rem}.place .icon{font-size:35px}.town{padding-right:12px;padding-left:12px;min-height:405px}.hero{top:25px}.hero .unicorn{font-size:63px}}
</style></head>
<body><main class="page"><header class="top"><div class="brand">🌈 Rainbow World<small>عالم كوكو السحري</small></div><div id="coins" class="coin">0</div></header><section class="game-card"><div class="sky"><span class="cloud a">☁️</span><span class="cloud b">☁️</span><div class="rainbow"></div></div><div class="town"><div class="path"></div><div class="hero"><span class="unicorn">🦄</span><span class="coco">👧</span><b>كوكو ورفيقها السحري</b></div><div class="places"><button class="place" data-place="home" data-icon="🏡" data-title="بيت كوكو" data-task="رتّبي غرفة كوكو واكسبي 10 عملات!"><span class="icon">🏡</span>بيت كوكو</button><button class="place" data-place="forest" data-icon="🌳" data-title="الغابة السحرية" data-task="ساعدي الأرنب الصغير ليجد جزراته واكسبي 15 عملة!"><span class="icon">🦊</span>الغابة</button><button class="place" data-place="hospital" data-icon="🏥" data-title="مستشفى الحيوانات" data-task="عالجي القطة اللطيفة واكسبي 20 عملة!"><span class="icon">🐾</span>المستشفى</button><button class="place locked" data-cost="30"><span class="icon">🛍️</span>المتجر</button><button class="place locked" data-cost="50"><span class="icon">🏝️</span>الجزيرة السرية</button><button class="place locked" data-cost="70"><span class="icon">🏰</span>القصر</button></div></div><div class="bottom"><div class="quest"><span id="quest">المهمة: اختاري مكانًا للمغامرة!</span><b id="progress">0 / 3</b></div><a class="share" href="https://www.facebook.com/sharer/sharer.php?u=https%3A%2F%2Fmouadhjaber.com%2Frainbow-world.html" target="_blank" rel="noopener noreferrer">شارك عالم قوس قزح على فيسبوك</a></div></section><footer>© ٢٠٢٦ · Rainbow World — عالم كوكو السحري</footer></main><div id="modal" class="modal"><div class="modal-box"><div id="modalIcon" class="big">🏡</div><h2 id="modalTitle">بيت كوكو</h2><p id="modalTask"></p><button id="complete" class="play">أكملي المهمة ✨</button></div></div><script>(()=>{let coins=0,completed=0,current;const coin=document.querySelector('#coins'),quest=document.querySelector('#quest'),progress=document.querySelector('#progress'),modal=document.querySelector('#modal'),title=document.querySelector('#modalTitle'),icon=document.querySelector('#modalIcon'),task=document.querySelector('#modalTask');function refresh(){coin.textContent=coins;progress.textContent=completed+' / 3';document.querySelectorAll('.locked').forEach(x=>{const c=+x.dataset.cost;if(coins>=c){x.classList.remove('locked');x.dataset.icon=x.querySelector('.icon').textContent;x.dataset.title=x.textContent.trim();x.dataset.task='استكشفي هذا المكان الجديد واكسبي 25 عملة!'}})}function burst(){for(let i=0;i<18;i++){let x=document.createElement('i');x.className='spark';x.textContent=['✨','🌈','💖','🪙'][i%4];x.style.left=(45+Math.random()*10)+'%';x.style.top='54%';document.body.append(x);setTimeout(()=>x.remove(),900)}}document.querySelectorAll('.place').forEach(b=>b.onclick=()=>{if(b.classList.contains('locked')){quest.textContent='اجمعي '+b.dataset.cost+' عملة لفتح هذا المكان!';return}current=b;icon.textContent=b.dataset.icon;title.textContent=b.dataset.title;task.textContent=b.dataset.task;modal.classList.add('show')});document.querySelector('#complete').onclick=()=>{if(!current)return;let gain=current.dataset.place==='home'?10:current.dataset.place==='forest'?15:20;coins+=gain;completed+=current.dataset.place?1:0;current.disabled=true;current.style.opacity='.55';modal.classList.remove('show');quest.textContent='رائع يا كوكو! ربحتِ '+gain+' عملة.';burst();refresh()};modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show')};refresh()})();</script></body></html>
