<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="مفتاح المثلثات: لعبة أرقام عربية ثلاثية الأبعاد للأطفال.">
  <meta property="og:type" content="website"><meta property="og:title" content="مفتاح المثلثات | لعبة ثلاثية الأبعاد"><meta property="og:description" content="اكتشف الرقم الناقص بين الوردة والبطة."><meta property="og:url" content="https://mouadhjaber.com/triangle-key-game.html">
  <title>مفتاح المثلثات | لعبة ثلاثية الأبعاد</title>
  <style>
    :root{--ink:#182044;--violet:#4c3a9a;--pink:#ff7aa9;--gold:#ffcf56;--mint:#96f3d3}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#372b77;color:#fff;font-family:Tahoma,Arial,sans-serif}#world{position:fixed;inset:0;touch-action:none}#world canvas{display:block;width:100%;height:100%}.top{position:fixed;z-index:2;top:max(16px,env(safe-area-inset-top));right:16px;left:16px;display:flex;justify-content:space-between;align-items:start;gap:12px;pointer-events:none}.brand,.badge{padding:10px 14px;border:1px solid #ffffff7a;border-radius:16px;background:#25205cc9;box-shadow:0 10px 30px #120d3d77;backdrop-filter:blur(10px)}.brand{font-weight:900;font-size:clamp(1rem,3vw,1.35rem)}.brand small{display:block;margin-top:3px;color:var(--mint);font-size:.67em}.badge{color:var(--gold);font-weight:bold}.card{position:fixed;z-index:3;right:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(50%);width:min(570px,calc(100% - 28px));padding:17px 18px;text-align:center;border:1px solid #ffffff82;border-radius:22px;background:#25205ceb;box-shadow:0 14px 36px #120d3d85}.eyebrow{margin-bottom:5px;color:var(--gold);font-size:.78rem;font-weight:bold}.card h1{margin:0 0 7px;font-size:clamp(1.1rem,4.5vw,1.5rem)}.card p{margin:0;color:#f1efff;font-size:.93rem;line-height:1.7}.answers{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:13px}.answer,.restart{min-width:82px;padding:10px 18px;border:0;border-radius:12px;background:#fff5d9;color:var(--ink);font:900 1rem Tahoma,Arial,sans-serif;cursor:pointer;transition:transform .18s,background .18s}.answer:hover,.answer:focus-visible,.restart:hover,.restart:focus-visible{transform:translateY(-3px);background:var(--gold)}.answers[hidden],.restart[hidden]{display:none}.hint{position:fixed;z-index:2;right:50%;top:104px;transform:translateX(50%);width:max-content;max-width:calc(100% - 32px);padding:8px 12px;border-radius:99px;background:#242057b8;color:#fff;text-align:center;font-size:.82rem;pointer-events:none}.end{position:fixed;z-index:5;inset:0;display:grid;place-items:center;padding:20px;background:#171241a8;opacity:0;visibility:hidden;transition:.25s}.end.show{opacity:1;visibility:visible}.endbox{width:min(390px,100%);padding:28px 22px;text-align:center;color:var(--ink);border-radius:25px;background:#fff8df;box-shadow:0 20px 70px #0e0a2e}.endbox .star{font-size:3rem}.endbox h2{margin:5px 0;color:var(--violet)}.endbox p{line-height:1.7}.restart{background:var(--violet);color:#fff}.credit{position:fixed;z-index:2;bottom:8px;right:50%;transform:translateX(50%);font-size:.7rem;color:#ffffffb8;white-space:nowrap;pointer-events:none}@media(max-width:480px){.badge{display:none}.card{padding:14px}.hint{top:90px}.credit{display:none}}
  </style>
</head>
<body>
  <main id="world" aria-label="لعبة مفتاح المثلثات ثلاثية الأبعاد"></main>
  <header class="top"><div class="brand">مفتاح المثلثات<small>لغز الأرقام ثلاثي الأبعاد</small></div><div class="badge">المفاتيح: <span id="score">٠</span> / ٣</div></header>
  <div id="hint" class="hint">المس المفتاح الذهبي لتبدأ</div>
  <section class="card" aria-live="polite"><div id="eyebrow" class="eyebrow">الخطوة ١</div><h1 id="title">أين السؤال السري؟</h1><p id="text">اضغط على المفتاح الذهبي، ثم المس المثلثات لتقرأ دلائلها.</p><div id="answers" class="answers" hidden><button class="answer" data-answer="17">١٧</button><button class="answer" data-answer="23">٢٣</button><button class="answer" data-answer="36">٣٦</button></div></section>
  <div id="end" class="end" role="dialog" aria-modal="true" aria-labelledby="end-title"><div class="endbox"><div class="star">🔑✨</div><h2 id="end-title">فتحتِ السؤال السري!</h2><p id="success-text"></p><button id="restart" class="restart">العب من جديد</button></div></div>
  <span class="credit">اسحب لتدوير المشهد · المس العناصر المضيئة</span>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js';
    const host=document.querySelector('#world'),hint=document.querySelector('#hint'),title=document.querySelector('#title'),text=document.querySelector('#text'),eyebrow=document.querySelector('#eyebrow'),answers=document.querySelector('#answers'),scoreEl=document.querySelector('#score'),end=document.querySelector('#end');
    const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;host.appendChild(renderer.domElement);scene.background=new THREE.Color(0x7869c4);scene.fog=new THREE.Fog(0x7869c4,14,35);camera.position.set(0,7.3,14);camera.lookAt(0,1.5,0);
    const root=new THREE.Group();scene.add(root);const mat=(color,emissive=0)=>new THREE.MeshStandardMaterial({color,roughness:.52,metalness:.12,emissive,emissiveIntensity:.35});const floor=new THREE.Mesh(new THREE.CircleGeometry(25,64),mat(0x5b4ca6));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;root.add(floor);scene.add(new THREE.HemisphereLight(0xffebd0,0x3d3379,2.5));const sun=new THREE.DirectionalLight(0xfff1c6,3.2);sun.position.set(5,11,8);sun.castShadow=true;scene.add(sun);
    const ar=n=>new Intl.NumberFormat('ar-EG').format(n),answer=20+Math.floor(Math.random()*10),duckNumber=10+Math.floor(Math.random()*10),flowerNumber=answer+duckNumber;const triangles=[],ray=new THREE.Raycaster(),pointer=new THREE.Vector2();let started=false,found=0,drag=false,lastX=0;
    function label(text,color=0xffffff){const c=document.createElement('canvas');c.width=320;c.height=150;const x=c.getContext('2d');x.fillStyle='#ffffffee';x.beginPath();x.roundRect(6,6,308,138,30);x.fill();x.fillStyle='#20204c';x.font='900 72px Tahoma';x.textAlign='center';x.textBaseline='middle';x.fillText(text,160,79);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true}));s.scale.set(2.25,1.05,1);return s}
    function triangle({x,z,number,icon,color,action}){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.ConeGeometry(2.25,.72,3),mat(color));body.rotation.y=Math.PI/6;body.castShadow=true;g.add(body);const plate=label(`${icon}  ${number}`);plate.position.set(0,.85,0);g.add(plate);g.position.set(x,.42,z);g.userData={action,number,plate};root.add(g);triangles.push(g);return g}
    const flower=triangle({x:-4,z:0,number:ar(flowerNumber),icon:'🌸',color:0xff7cad,action:'flower'}),duck=triangle({x:4,z:0,number:ar(duckNumber),icon:'🦆',color:0xffc64f,action:'duck'}),secret=triangle({x:0,z:-3.8,number:'؟',icon:'❔',color:0x91e7cf,action:'secret'});const choices=[answer,answer-2,answer+3].sort(()=>Math.random()-.5);answers.innerHTML=choices.map(n=>`<button class="answer" data-answer="${n}">${ar(n)}</button>`).join('');document.querySelector('#success-text').innerHTML=`الرقم الناقص هو <b>${ar(answer)}</b>. أحسنتِ يا بطلة المثلثات!`;
    const key=new THREE.Group();const ring=new THREE.Mesh(new THREE.TorusGeometry(.45,.13,12,30),mat(0xffcf56,0x6a4800));ring.position.y=.5;const shaft=new THREE.Mesh(new THREE.BoxGeometry(.25,.16,1.3),mat(0xffcf56,0x6a4800));shaft.position.set(0,.5,.82);const tooth=new THREE.Mesh(new THREE.BoxGeometry(.42,.18,.2),mat(0xffcf56,0x6a4800));tooth.position.set(.08,.5,1.35);key.add(ring,shaft,tooth);key.position.set(0,.6,2.5);key.rotation.x=Math.PI/2;key.userData.action='key';root.add(key);const glow=new THREE.PointLight(0xffd75e,3,8);glow.position.set(0,3,2.5);scene.add(glow);
    function setCard(step,heading,copy){eyebrow.textContent=step;title.textContent=heading;text.textContent=copy}function inspect(kind){if(!started)return;if(kind==='flower'){found|=1;setCard('دليل ١ من ٣','مثلث الوردة',`على مثلث الوردة الرقم ${ar(flowerNumber)}. احفظيه جيداً!`)}if(kind==='duck'){found|=2;setCard('دليل ٢ من ٣','مثلث البطة',`على مثلث البطة الرقم ${ar(duckNumber)}. بقي سر واحد!`)}if(kind==='secret'){found|=4;if((found&3)===3){setCard('السؤال السري','اكتبي الرقم الناقص',`اطرحي رقم البطة من رقم الوردة: ${ar(flowerNumber)} − ${ar(duckNumber)} = ؟`);answers.hidden=false;hint.textContent='اختاري الرقم الصحيح من البطاقات'}else{setCard('المثلث مقفل','ابحثي عن الدليلين أولاً','المسي مثلث الوردة ومثلث البطة، ثم عودي إلى هذا المثلث.')}scoreEl.textContent=ar(((found&1)?1:0)+((found&2)?1:0)+((found&4)?1:0))}}
    function begin(){started=true;key.visible=false;hint.textContent='المسي مثلث الوردة ومثلث البطة ثم المثلث بعلامة السؤال';setCard('ابدئي الاستكشاف','ثلاثة مثلثات أمامك','اجمعي الدليلين، ثم اطرحي رقم البطة من رقم الوردة. السؤال مخبأ في المثلث الثالث.');}
    renderer.domElement.addEventListener('pointerdown',e=>{drag=false;lastX=e.clientX});renderer.domElement.addEventListener('pointermove',e=>{if(e.buttons){drag=true;root.rotation.y+=(e.clientX-lastX)*.006;lastX=e.clientX}});renderer.domElement.addEventListener('pointerup',e=>{if(drag)return;const r=renderer.domElement.getBoundingClientRect();pointer.x=((e.clientX-r.left)/r.width)*2-1;pointer.y=-((e.clientY-r.top)/r.height)*2+1;ray.setFromCamera(pointer,camera);const hit=ray.intersectObjects(root.children,true)[0];if(!hit)return;let o=hit.object;while(o&&!o.userData.action)o=o.parent;if(!o)return;o.userData.action==='key'?begin():inspect(o.userData.action)});
    answers.onclick=e=>{const b=e.target.closest('[data-answer]');if(!b)return;if(Number(b.dataset.answer)===answer){end.classList.add('show')}else{hint.textContent='ليست هذه الإجابة، حاولي من جديد!';b.style.background='#ff9b9b';setTimeout(()=>b.style.background='',500)}};
    const clock=new THREE.Clock();function animate(){const t=clock.getElapsedTime();if(!started){key.rotation.z=Math.sin(t*2)*.16;key.position.y=.7+Math.sin(t*3)*.12}triangles.forEach((g,i)=>g.position.y=.42+Math.sin(t*1.8+i)*.055);glow.intensity=2.4+Math.sin(t*4)*.7;renderer.render(scene,camera);requestAnimationFrame(animate)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});document.querySelector('#restart').onclick=()=>location.reload();
  </script>
</body>
</html>
