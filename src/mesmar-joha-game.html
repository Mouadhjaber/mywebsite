<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="مسمار جحا: لعبة قصة عربية ثلاثية الأبعاد عن الانتباه إلى الشروط الصغيرة.">
  <meta property="og:type" content="website"><meta property="og:title" content="مسمار جحا | لعبة ثلاثية الأبعاد"><meta property="og:description" content="عش حكاية جحا والمسمار، واجمع النقاط باختياراتك الذكية."><meta property="og:url" content="https://mouadhjaber.com/mesmar-joha-game.html">
  <title>مسمار جحا | لعبة ثلاثية الأبعاد</title>
  <style>
    :root{--navy:#111c3b;--blue:#253c75;--paper:#fff5d6;--gold:#ffcc53;--mint:#9bf1cc;--red:#ef715f;--ink:#17233d}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#111c3b;color:#fff;font-family:Tahoma,Arial,sans-serif}#world{position:fixed;inset:0;touch-action:none}#world canvas{display:block;width:100%;height:100%}.top{position:fixed;z-index:3;top:max(16px,env(safe-area-inset-top));right:16px;left:16px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}.brand,.score{border:1px solid #ffffff75;background:#142456cc;backdrop-filter:blur(12px);box-shadow:0 7px 22px #060c2670;border-radius:17px;padding:10px 14px}.brand{font-weight:900;font-size:clamp(1rem,3vw,1.35rem)}.brand small{display:block;margin-top:2px;color:var(--mint);font-size:.66em}.score{color:var(--gold);font-weight:bold;white-space:nowrap}.score b{font-size:1.2em}.progress{position:fixed;z-index:3;top:91px;right:50%;transform:translateX(50%);display:flex;gap:7px;pointer-events:none}.dot{width:11px;height:11px;border:2px solid #fff;border-radius:50%;background:#ffffff35}.dot.on{background:var(--mint);border-color:var(--mint);box-shadow:0 0 12px var(--mint)}.card{position:fixed;z-index:4;right:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(50%);width:min(560px,calc(100% - 28px));padding:17px 18px;border:1px solid #ffffff80;border-radius:22px;background:#142456e8;box-shadow:0 14px 35px #060c2670;text-align:center}.chapter{margin-bottom:5px;color:var(--gold);font-size:.77rem;font-weight:bold}.card h1{margin:0 0 7px;font-size:clamp(1.12rem,4.6vw,1.55rem)}.card p{margin:0;color:#e8edff;font-size:.94rem;line-height:1.7}.choices{display:grid;gap:8px;margin-top:13px}.choice,.restart{min-height:46px;padding:9px 12px;border:0;border-radius:12px;background:#fff4d7;color:var(--ink);font:700 .9rem Tahoma,Arial,sans-serif;cursor:pointer;transition:transform .18s,background .18s}.choice:hover,.choice:focus-visible,.restart:hover,.restart:focus-visible{transform:translateY(-2px);background:var(--mint);outline:3px solid var(--gold);outline-offset:2px}.hint{position:fixed;z-index:2;top:126px;right:50%;transform:translateX(50%);width:max-content;max-width:calc(100% - 30px);padding:8px 14px;border-radius:999px;background:#fff8df;color:#5d3a23;text-align:center;font-size:.8rem;font-weight:bold;box-shadow:0 4px 12px #0003;transition:opacity .3s}.end{display:none;position:fixed;z-index:6;inset:0;place-items:center;padding:22px;background:#0b143bd9}.end.show{display:grid}.endbox{width:min(470px,100%);padding:30px 25px;border:2px solid var(--gold);border-radius:25px;background:linear-gradient(145deg,#243d7e,#142456);text-align:center;box-shadow:0 18px 60px #0008}.endbox .star{font-size:3.2rem}.endbox h2{margin:8px 0;color:var(--gold);font-size:1.8rem}.endbox p{line-height:1.85;color:#e9eeff}.finalscore{color:var(--mint);font-size:1.15rem;font-weight:bold}.restart{padding:11px 22px;margin-top:8px}.credit{position:fixed;z-index:2;left:14px;bottom:12px;color:#fff9;font-size:.68rem}@media(max-width:500px){.top{top:10px;right:10px;left:10px}.brand,.score{padding:8px 10px}.progress{top:75px}.hint{top:104px}.card{padding:14px;border-radius:18px}.credit{display:none}}
  </style>
</head>
<body>
  <main id="world" aria-label="لعبة مسمار جحا ثلاثية الأبعاد"></main>
  <header class="top"><div class="brand">مسمار جحا<small>حكاية تفاعلية ثلاثية الأبعاد</small></div><div class="score">النقاط <b id="score">٠</b> / ١٠٠</div></header>
  <div class="progress" aria-label="تقدم القصة"><i class="dot on"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>
  <div id="hint" class="hint">المسمار يلمع على الحائط — المسه لتفحص الشرط</div>
  <section class="card" aria-live="polite"><div id="chapter" class="chapter">المشهد ١ من ٤</div><h1 id="title">بيت جديد… وشرط غريب</h1><p id="text">باع جحا بيته، لكنه احتفظ بمسمار واحد في الحائط. اضغط المسمار الذهبي لتفحصه.</p><div id="choices" class="choices"></div></section>
  <div id="end" class="end" role="dialog" aria-modal="true" aria-labelledby="end-title"><div class="endbox"><div class="star">⭐</div><h2 id="end-title">مفاوض ذكي!</h2><p id="ending"></p><p class="finalscore">نتيجتك: <span id="finalscore"></span> / ١٠٠</p><button id="restart" class="restart">العب من جديد</button></div></div>
  <span class="credit">حرّك المشهد بالسحب · المس العناصر المضيئة</span>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js';
    const host=document.querySelector('#world'),scoreEl=document.querySelector('#score'),hint=document.querySelector('#hint'),chapter=document.querySelector('#chapter'),title=document.querySelector('#title'),text=document.querySelector('#text'),choices=document.querySelector('#choices'),end=document.querySelector('#end');
    const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100),renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;host.appendChild(renderer.domElement);scene.background=new THREE.Color(0x78c6e6);scene.fog=new THREE.Fog(0x78c6e6,18,45);camera.position.set(8,6,12);camera.lookAt(0,2,0);
    const mat=(color,rough=.65,metal=0)=>new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal});const wood=mat(0x8d4b29),wall=mat(0xf0bc6e),skin=mat(0xb96f47),dark=mat(0x26345e),white=mat(0xf7efd7),gold=mat(0xffc84e,.3,.6);const root=new THREE.Group();scene.add(root);const floor=new THREE.Mesh(new THREE.PlaneGeometry(60,60),mat(0x66a968));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;root.add(floor);const sun=new THREE.DirectionalLight(0xfff1c7,3);sun.position.set(5,12,8);sun.castShadow=true;scene.add(sun,new THREE.HemisphereLight(0xe7fbff,0x547440,2.2));
    function mesh(g,m,x=0,y=0,z=0){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;return o}function house(){const h=new THREE.Group();h.add(mesh(new THREE.BoxGeometry(8,5,.55),wall,0,2.5,-1.5));const roof=mesh(new THREE.ConeGeometry(5.5,2.5,4),mat(0xb5543d),0,6,-1.5);roof.rotation.y=Math.PI/4;h.add(roof);h.add(mesh(new THREE.BoxGeometry(1.5,2.7,.15),wood,0,1.35,-1.17));for(const x of[-2.6,2.6]){const w=mesh(new THREE.BoxGeometry(1.25,1.2,.12),mat(0x79cde3),x,3.5,-1.16);h.add(w)}root.add(h)}house();
    function person({x,color,name,flip=1}){const p=new THREE.Group();const body=mesh(new THREE.CylinderGeometry(.55,.75,1.7,12),mat(color),0,1.65,0);const head=mesh(new THREE.SphereGeometry(.55,18,14),skin,0,3,0);const turban=mesh(new THREE.SphereGeometry(.62,18,12),white,0,3.34,0);turban.scale.y=.42;const nose=mesh(new THREE.SphereGeometry(.11,10,8),skin,0,2.95,.53);const arm=mesh(new THREE.CylinderGeometry(.14,.14,1.4,9),mat(color),flip*.65,1.9,0);arm.rotation.z=flip*.65;p.add(body,head,turban,nose,arm);p.position.set(x,0,1);p.userData.name=name;root.add(p);return p}const joha=person({x:4.1,color:0x3a72a7,name:'جحا',flip:-1}),buyer=person({x:-3.6,color:0x6c8a58,name:'المشتري'});buyer.rotation.y=.35;joha.rotation.y=-.25;
    const nail=mesh(new THREE.CylinderGeometry(.07,.07,.8,12),gold,.85,3.5,-1.1);nail.rotation.z=Math.PI/2;nail.userData.action='nail';root.add(nail);const head=mesh(new THREE.SphereGeometry(.18,12,10),gold,1.22,3.5,-1.1);head.userData.action='nail';root.add(head);const spark=new THREE.PointLight(0xffd05c,2.8,4);spark.position.set(1,3.5,-.2);root.add(spark);
    const props=[];function prop(type,color){const p=mesh(type==='meat'?new THREE.DodecahedronGeometry(.42):new THREE.BoxGeometry(.6,.45,.18),mat(color),1.13,3.18,-.8);p.userData.action='evidence';p.visible=false;root.add(p);props.push(p);return p}prop('coat',0x71486d);prop('bag',0xa66c38);prop('meat',0xbf554b);const clock=new THREE.Clock(),ray=new THREE.Raycaster(),pointer=new THREE.Vector2();let stage=0,score=0,evidence=0,drag=false,lastX=0;
    const arabic=n=>new Intl.NumberFormat('ar-EG').format(n);function add(n){score=Math.min(100,score+n);scoreEl.textContent=arabic(score)}function dots(){document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i<=stage))}function setCard(c,t,p,opts=[]){chapter.textContent=`المشهد ${arabic(stage+1)} من ٤`;title.textContent=t;text.textContent=p;choices.innerHTML='';opts.forEach(o=>{const b=document.createElement('button');b.className='choice';b.textContent=o.label;b.onclick=o.fn;choices.append(b)})}function revealEvidence(){stage=2;dots();hint.textContent='جحا علّق أشياء على مسماره. المس كل شيء لتسجل ما حدث!';props.forEach((p,i)=>{p.visible=true;p.position.x=1.1+(i-1)*.08;p.position.y=3.12-i*.36});setCard('', 'زيارات لا تنتهي', 'المعطف ثم الكيس ثم اللحم… الشرط الصغير صار مشكلة كبيرة. اجمع الأدلة من الحائط.',[])}function finalChoice(good){stage=3;dots();props.forEach(p=>p.visible=false);hint.style.opacity='0';setCard('',good?'حلّ يحمي الجميع':'ثمن تجاهل الشرط','', [{label:good?'اعرض النتيجة':'اعرف العبرة',fn:()=>finish(good)}])}function finish(good){document.querySelector('#finalscore').textContent=arabic(score);document.querySelector('#ending').textContent=good?'أعدت التفاوض وكتبت حدوداً واضحة لاستعمال المسمار. العبرة: لا تستهِن بشرط صغير؛ اقرأ الاتفاق كاملاً قبل أن توافق.':'تركت الشرط الغامض كما هو، فاستعمله جحا للسيطرة على البيت. العبرة: التفاصيل الصغيرة قد تكون أهم ما في الاتفاق.';end.classList.add('show')}
    function afterNail(){stage=1;add(20);dots();hint.textContent='اقرأ الشرط بعناية قبل إتمام البيع.';setCard('', 'الشرط في العقد', '«المسمار ملك لجحا، وله حق استعماله». كيف تتصرف قبل توقيع العقد؟',[{label:'أطلب تحديد وقت وطريقة استعمال المسمار كتابةً (+30)',fn:()=>{add(30);revealEvidence()}},{label:'مسمار واحد لا يهم، أوافق فوراً',fn:()=>{add(0);revealEvidence()}}])}
    function investigate(){if(stage!==2)return;evidence++;props[evidence-1].visible=false;add(10);hint.textContent=`سجلت ${arabic(evidence)} من ٣ أدلة`;if(evidence===3){hint.textContent='اكتملت الصورة: ما أفضل قرار الآن؟';setCard('', 'قرار المالك', 'تبيّن أن الشرط غير الواضح منح جحا مدخلاً دائماً إلى البيت. ما الحل الأكثر حكمة؟',[{label:'أتفاوض على إنهاء الشرط أو شراء المسمار (+20)',fn:()=>{add(20);finalChoice(true)}},{label:'أتجاهل الأمر، ربما يتوقف وحده',fn:()=>finalChoice(false)}])}}
    renderer.domElement.addEventListener('pointerdown',e=>{drag=false;lastX=e.clientX});renderer.domElement.addEventListener('pointermove',e=>{if(e.buttons){drag=true;root.rotation.y+=(e.clientX-lastX)*.006;lastX=e.clientX}});renderer.domElement.addEventListener('pointerup',e=>{if(drag)return;const r=renderer.domElement.getBoundingClientRect();pointer.x=((e.clientX-r.left)/r.width)*2-1;pointer.y=-((e.clientY-r.top)/r.height)*2+1;ray.setFromCamera(pointer,camera);const hit=ray.intersectObjects(root.children,true)[0];if(!hit)return;const action=hit.object.userData.action;if(action==='nail'&&stage===0)afterNail();if(action==='evidence')investigate()});
    add(0);function animate(){const t=clock.getElapsedTime();joha.position.y=Math.sin(t*2)*.035;joha.rotation.y=-.25+Math.sin(t)*.05;nail.rotation.y=Math.sin(t*3)*.1;spark.intensity=2.3+Math.sin(t*4)*.8;renderer.render(scene,camera);requestAnimationFrame(animate)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});document.querySelector('#restart').onclick=()=>location.reload();
  </script>
</body>
</html>
